[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-dashboard"
version = "0.1.0"
description = "Web dashboard for the SO-101 arm: 3D twin, manual/keyboard/gamepad control, motor status"
requires-python = ">=3.10"
# needs the `so101` package from ../08_so101_framework (installed by that folder's installer);
# otherwise only the Python standard library
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
ai = ["anthropic>=2.8"]          # AI tab (Claude); everything else needs only the standard library

[project.scripts]
so101-dashboard = "so101_dashboard.__main__:main"
so101-robot = "so101_dashboard.robot_cli:main"

[tool.setuptools.packages.find]
include = ["so101_dashboard*"]

[tool.setuptools.package-data]
so101_dashboard = ["static/*", "static/brand/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
